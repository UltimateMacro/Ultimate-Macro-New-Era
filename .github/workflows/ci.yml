name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahk-validate:
    name: AutoHotkey validation and hidden regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Load-check Main.ahk and submacros with the bundled AutoHotkey
        run: node .github/scripts/validate_runtime.mjs
