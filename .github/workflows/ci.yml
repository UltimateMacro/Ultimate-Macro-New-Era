name: Ultimate Macro CI

on:
  push:
    branches:
      - main
      - integration
      - 'dev/**'
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'release/**'
      - 'qa/**'
  pull_request:
    branches:
      - main
      - integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Synchronize pinned source dependencies
        shell: pwsh
        run: ./tools/sync_dependencies.ps1

      - name: Compile Python validators
        shell: pwsh
        run: |
          python -m py_compile tests/test_source_contracts.py tests/test_reported_runtime_fixes.py tests/validate_repo.py tests/lint_strategies.py tests/test_release_package.py tools/build_release.py

      - name: Source regression contracts
        shell: pwsh
        run: |
          python tests/test_source_contracts.py .
          python tests/test_reported_runtime_fixes.py .

      - name: Repository integrity
        shell: pwsh
        run: python tests/validate_repo.py .

      - name: Strategy grammar lint
        shell: pwsh
        run: python tests/lint_strategies.py .

      - name: Validate PowerShell source
        shell: pwsh
        run: ./tools/validate_powershell.ps1

      - name: Transactional updater smoke test
        shell: pwsh
        run: ./tests/safe_updater_smoke.ps1

      - name: Validate AutoHotkey source load
        shell: pwsh
        run: ./tools/validate_ahk.ps1

      - name: Build clean release package
        shell: pwsh
        run: python tools/build_release.py .

      - name: Validate release package
        shell: pwsh
        run: python tests/test_release_package.py .

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check HEAD^ HEAD
