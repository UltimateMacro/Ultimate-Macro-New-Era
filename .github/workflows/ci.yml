name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahk-validate:
    name: AutoHotkey syntax check
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Main.ahk and engine
        shell: pwsh
        run: |
          $ahk = (Resolve-Path engine/submacros/AutoHotkey64.exe).Path
          foreach ($script in @('Main.ahk', 'engine/UM14Engine.ahk')) {
            $p = Start-Process $ahk -ArgumentList '/ErrorStdOut', '/validate', $script -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput stdout.txt -RedirectStandardError stderr.txt
            if ($p.ExitCode -ne 0) { Get-Content stdout.txt, stderr.txt; throw "$script failed validation" }
            Write-Host "$script OK"
          }
      - name: Run lobby and profile regressions
        shell: pwsh
        run: |
          $ahk = (Resolve-Path engine/submacros/AutoHotkey64.exe).Path
          foreach ($script in @('TestLegacyProfile.ahk', 'TestModeSelection.ahk', 'TestReleaseUi.ahk', 'TestInventoryQuery.ahk', 'TestTimescale.ahk')) {
            $p = Start-Process $ahk -ArgumentList '/ErrorStdOut', $script -WindowStyle Hidden -PassThru -RedirectStandardOutput stdout.txt -RedirectStandardError stderr.txt
            if (!$p.WaitForExit(15000)) { Stop-Process -Id $p.Id; throw "$script timed out" }
            Get-Content stdout.txt, stderr.txt
            if ($p.ExitCode -ne 0) { throw "$script failed" }
          }
