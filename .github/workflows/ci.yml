name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ahk-validate:
    name: AutoHotkey validation and hidden regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate runtime and updater safety tests
        run: node .github/scripts/validate_runtime.mjs
      - name: Check hidden layouts and pairing controls
        run: node tests/Run-UI-Smoke.mjs
      - name: Check recording shortcut regression
        run: node tests/Run-UI-Smoke.mjs --shortcuts
      - name: Check recorder round trip with mocked game input
        run: node tests/Run-UI-Smoke.mjs --recorder
      - name: Check tray close/reopen and resize lifecycle
        run: node tests/Run-UI-Smoke.mjs --resident
      - name: Check bounded local health sampler
        run: node tests/Run-Health-QA.mjs
