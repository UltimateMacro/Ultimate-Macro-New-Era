name: Apply Strategy Lab v4.4 spatial actions

on:
  push:
    branches:
      - feature/strategy-lab-spatial-actions-v44
    paths:
      - .github/workflows/apply-strategy-lab-spatial-actions-v44.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strategy-lab-spatial-actions-v44
          fetch-depth: 0

      - name: Normalize updater asset order
        shell: pwsh
        run: |
          $path = 'submacros/safe_update.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $pattern = "(?m)^(\s*'_app\\ui\\app\.js',)\r?\n(\s*'_app\\ui\\index\.html',)\r?\n(\s*'_app\\ui\\styles\.css',)"
          $replacement = '$2' + [Environment]::NewLine + '$3' + [Environment]::NewLine + '$1'
          $next = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($next -eq $text) { throw 'safe_update asset order anchor not found' }
          [IO.File]::WriteAllText((Resolve-Path $path), $next, [Text.UTF8Encoding]::new($false))

      - name: Apply integration patch
        shell: pwsh
        run: |
          python _dev/apply_spatial_actions_v44.py
          $path = '_app/self_test.ps1'
          $lines = Get-Content -LiteralPath $path
          $found = $false
          $lines = $lines | ForEach-Object {
            if ($_ -like '*Strategy Lab v4.3 credit/version marker*' -or $_ -like '*Strategy Lab v4.4 credit/version marker*') {
              $found = $true
              "if (`$html -notmatch 'Strategy Lab v4\.4' -or `$html -notmatch 'pizzaroles24') { Fail 'Strategy Lab v4.4 credit/version marker is missing' } else { Pass 'Strategy Lab v4.4 credit/version marker' }"
            } else {
              $_
            }
          }
          if (-not $found) { throw 'Strategy Lab footer contract anchor not found' }
          [IO.File]::WriteAllLines((Resolve-Path $path), [string[]]$lines, [Text.UTF8Encoding]::new($false))

      - name: Run JavaScript validation
        shell: pwsh
        run: |
          node --check _app/ui/app.js
          node --check _app/ui/spatial-actions.js
          node _app/tests/spatial_actions.test.js

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @('_app/run_editor.ps1', '_app/self_test.ps1', 'submacros/safe_update.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Run Strategy Lab self-test
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File _app/self_test.ps1 -AhkPath submacros\AutoHotkey64.exe

      - name: Check diff hygiene
        shell: pwsh
        run: |
          git diff --check
          git status --short

      - name: Commit feature integration
        shell: pwsh
        run: |
          git config user.name "Pizzaroles"
          git config user.email "alpizars2005@icloud.com"
          git add README.md _app/ui/index.html _app/ui/app.js _app/run_editor.ps1 _app/self_test.ps1 submacros/safe_update.ps1
          if (git diff --cached --quiet) { throw 'No feature changes were produced.' }
          git commit -m "Edit spatial tower actions in Strategy Lab"
          git push origin HEAD:feature/strategy-lab-spatial-actions-v44
