name: Apply v1.3.5 upgrade hotfix

on:
  push:
    branches:
      - fix/v1.3.5-upgrade-affordance
    paths:
      - .github/workflows/apply-v135-upgrade-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.5-upgrade-affordance
          fetch-depth: 0

      - name: Patch upgrade affordability and confirmation
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          main_path = Path('Main.ahk')
          text = main_path.read_text(encoding='utf-8-sig')

          old_helpers = re.compile(
              r'UpgradeButtonIsReady\(x1, y1, x2, y2, &foundX := 0, &foundY := 0\) \{.*?\n\}\n\n'
              r'HasStableUpgradeAffordance\(x1, y1, x2, y2\) \{.*?\n\}\n',
              re.S,
          )
          new_helpers = r'''UpgradePixelLooksEnabled(color) {
              r := (color >> 16) & 0xFF
              g := (color >> 8) & 0xFF
              b := color & 0xFF
              return (g >= 72 && g >= r + 22 && g >= b + 10)
          }

          UpgradeButtonGreenCoverage(x1, y1, x2, y2, &foundX := 0, &foundY := 0) {
              width := x2 - x1
              height := y2 - y1
              if (width <= 0 || height <= 0)
                  return 0

              xSamples := [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
              ySamples := [0.25, 0.50, 0.75]
              greenSamples := 0

              for yRatio in ySamples {
                  for xRatio in xSamples {
                      px := Round(x1 + width * xRatio)
                      py := Round(y1 + height * yRatio)
                      try color := PixelGetColor(px, py, "RGB")
                      catch Error
                          continue

                      if UpgradePixelLooksEnabled(color) {
                          greenSamples++
                          if (!foundX && !foundY) {
                              foundX := px
                              foundY := py
                          }
                      }
                  }
              }

              return greenSamples
          }

          UpgradeButtonIsReady(x1, y1, x2, y2, &foundX := 0, &foundY := 0) {
              ; A single matching pixel is not enough: red/grey unaffordable controls can
              ; contain green-ish antialiasing or neighboring UI. Require broad green
              ; coverage across the button interior instead.
              return UpgradeButtonGreenCoverage(x1, y1, x2, y2, &foundX, &foundY) >= 8
          }

          HasStableUpgradeAffordance(x1, y1, x2, y2) {
              if !UpgradeButtonIsReady(x1, y1, x2, y2)
                  return false
              Sleep(90)
              if !UpgradeButtonIsReady(x1, y1, x2, y2)
                  return false
              Sleep(90)
              return UpgradeButtonIsReady(x1, y1, x2, y2)
          }

          WaitForPersistentUpgradeEvidenceChange(x, y, w, h, beforeEvidence, timeoutMs := 1800) {
              if (beforeEvidence = "")
                  return false

              deadline := A_TickCount + Max(400, timeoutMs)
              changedFrames := 0
              loop {
                  evidence := CaptureUpgradeEvidence(x, y, w, h)
                  if (evidence != "" && evidence != beforeEvidence) {
                      changedFrames++
                      if (changedFrames >= 4)
                          return true
                  } else {
                      changedFrames := 0
                  }

                  if (A_TickCount >= deadline)
                      break
                  Sleep(120)
              }
              return false
          }
          '''
          text, count = old_helpers.subn(new_helpers, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one upgrade-helper block, replaced {count}')

          old_confirmation = re.compile(
              r'            afterEvidence := CaptureUpgradeEvidence\(XA, YA, WA, HA\)\n'
              r'            verifiedResV2 := ""\n'
              r'            verifiedResV1 := ""\n'
              r'            uiVerified := waitForTowerUI\(&verifiedResV2, &verifiedResV1, 1000\)\n'
              r'            if \(!uiVerified \|\| beforeEvidence = "" \|\| afterEvidence = "" \|\| beforeEvidence = afterEvidence\) \{.*?'
              r'            \}\n\n'
              r'            if \(afterEvidence = "" \|\| beforeEvidence = afterEvidence\) \{.*?'
              r'            \}\n\n'
              r'            upgradeActionAttempts := 0',
              re.S,
          )
          new_confirmation = r'''            verifiedResV2 := ""
              verifiedResV1 := ""
              uiVerified := waitForTowerUI(&verifiedResV2, &verifiedResV1, 1000)
              evidenceChanged := uiVerified
                  && WaitForPersistentUpgradeEvidenceChange(XA, YA, WA, HA, beforeEvidence, 1800)

              if (!evidenceChanged) {
                  if (upgradeActionAttempts < 1 && HasStableUpgradeAffordance(XA, YA, X2, Y2)) {
                      upgradeActionAttempts++
                      RuntimeLogWarn("upgrade_retry", "Upgrade was not persistently confirmed; retrying once within bounded budget",
                          "tower=" towerID "; next_level=" nextLevel "; attempt=" upgradeActionAttempts)
                      canUseAbility := true
                      needtocheckTowerUI := true
                      Sleep(350)
                      continue
                  }

                  LogToConsole("Tower " towerID " upgrade was not persistently confirmed; refusing to advance internal state.", true)
                  RuntimeLogWarn("upgrade_ambiguous", "Upgrade input did not produce persistent post-action evidence",
                      "tower=" towerID "; next_level=" nextLevel)
                  canUseAbility := true
                  return false
              }

              upgradeActionAttempts := 0'''
          text, count = old_confirmation.subn(new_confirmation, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one upgrade-confirmation block, replaced {count}')

          main_path.write_text(text, encoding='utf-8-sig')

          test_path = Path('_app/self_test.ps1')
          tests = test_path.read_text(encoding='utf-8-sig')
          marker = "if ($mainText -notmatch 'ActivateEnforcerVan' -or $mainText -notmatch 'EnforcerReposition' -or $mainText -notmatch 'EnforcerVanKey') { Fail 'Main runtime Enforcer ability commands are incomplete' } else { Pass 'Main runtime Enforcer ability commands' }\n"
          addition = r'''if ($mainText -notmatch 'UpgradeButtonGreenCoverage' -or $mainText -notmatch 'greenSamples\+\+' -or $mainText -notmatch 'greenSamples\) >= 8') { Fail 'Upgrade affordability guard does not require broad green coverage' } else { Pass 'Upgrade affordability guard requires broad green coverage' }
          if ($mainText -match 'enabledColors := \[0x206435, 0x206235, 0x2B8046, 0x1D5930\]') { Fail 'Upgrade affordability guard still accepts a single matching green pixel' } else { Pass 'Single-pixel upgrade affordability gate removed' }
          if ($mainText -notmatch 'WaitForPersistentUpgradeEvidenceChange' -or $mainText -notmatch 'changedFrames >= 4' -or $mainText -notmatch 'upgrade was not persistently confirmed') { Fail 'Upgrade confirmation does not require persistent post-action evidence' } else { Pass 'Upgrade confirmation requires persistent post-action evidence' }
          if ($mainText -notmatch 'upgradeActionAttempts < 1') { Fail 'Unconfirmed upgrade retry budget is not bounded to one retry' } else { Pass 'Unconfirmed upgrade retry budget is bounded' }
          '''
          if marker not in tests:
              raise SystemExit('self-test insertion marker not found')
          if 'Upgrade affordability guard requires broad green coverage' not in tests:
              tests = tests.replace(marker, marker + addition, 1)
          test_path.write_text(tests, encoding='utf-8-sig')
          '@ | Set-Content -LiteralPath hotfix_patch.py -Encoding UTF8
          python hotfix_patch.py
          Remove-Item hotfix_patch.py -Force

      - name: Run focused source contracts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          text = Path('Main.ahk').read_text(encoding='utf-8-sig')
          required = [
              'UpgradeButtonGreenCoverage',
              'greenSamples) >= 8',
              'WaitForPersistentUpgradeEvidenceChange',
              'changedFrames >= 4',
              'upgradeActionAttempts < 1',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('missing hotfix contracts: ' + ', '.join(missing))
          if 'enabledColors := [0x206435, 0x206235, 0x2B8046, 0x1D5930]' in text:
              raise SystemExit('single-pixel upgrade gate still present')
          print('Focused v1.3.5 upgrade source contracts: PASS')
          '@ | Set-Content -LiteralPath hotfix_contracts.py -Encoding UTF8
          python hotfix_contracts.py
          Remove-Item hotfix_contracts.py -Force

      - name: Run Strategy Lab self-test without AHK validator
        shell: pwsh
        run: |
          $path = '_app/self_test.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | ForEach-Object Message | Out-String) }
          Write-Host 'PowerShell syntax: PASS'

      - name: Check diff hygiene
        shell: pwsh
        run: |
          git diff --check
          git diff -- Main.ahk _app/self_test.ps1

      - name: Commit hotfix
        shell: pwsh
        run: |
          git config user.name "Pizzaroles"
          git config user.email "alpizars2005@icloud.com"
          git add Main.ahk _app/self_test.ps1
          git commit -m "Fix v1.3.5 upgrade affordability detection" -m "Require stable multi-point green coverage before Fast Upgrade input and persistent post-action evidence before advancing tower state. Bound ambiguous retries to one attempt and add focused source contracts."
          git push origin HEAD:fix/v1.3.5-upgrade-affordance
