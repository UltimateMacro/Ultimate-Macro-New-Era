name: Build v1.3.5 Final Candidate

on:
  push:
    branches:
      - fix/pizzaroles24/v1.3.5-dj-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Synchronize pinned source dependencies
        shell: pwsh
        run: ./tools/sync_dependencies.ps1

      - name: Run candidate validation
        shell: pwsh
        run: |
          python -m py_compile tests/test_source_contracts.py tests/test_reported_runtime_fixes.py tests/test_placement_ambiguity.py tests/validate_repo.py tests/lint_strategies.py tests/test_release_package.py tools/build_release.py
          python tests/test_source_contracts.py .
          python tests/test_reported_runtime_fixes.py .
          python tests/test_placement_ambiguity.py .
          python tests/validate_repo.py .
          python tests/lint_strategies.py .
          ./tools/validate_powershell.ps1
          ./tests/safe_updater_smoke.ps1
          ./tools/validate_ahk.ps1

      - name: Build exact user ZIP
        shell: pwsh
        run: python tools/build_release.py .

      - name: Validate user ZIP
        shell: pwsh
        run: python tests/test_release_package.py .

      - name: Verify repository metadata cannot ship
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path ./dist/TDS_Macro.zip))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            $bad = @($names | Where-Object {
              $_ -match '(^|/)\.git($|/)' -or
              $_ -match '(^|/)\.github($|/)' -or
              $_ -match '(^|/)(tests|tools|docs)($|/)' -or
              (($_ -match '\.md$') -and $_ -ne 'README.md') -or
              $_ -match '\.(bat|py|pyc|yml|yaml)$'
            })
            if ($bad.Count -gt 0) {
              throw "Developer/repository files leaked into TDS_Macro.zip: $($bad -join ', ')"
            }
            if ($names -notcontains 'README.md') {
              throw 'README.md is missing from TDS_Macro.zip.'
            }
            Write-Host "Release metadata audit: PASS ($($names.Count) entries)"
          }
          finally {
            $zip.Dispose()
          }

      - name: Create SHA-256 evidence
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./dist/TDS_Macro.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TDS_Macro.zip" | Set-Content -Encoding ascii ./dist/SHA256SUMS.txt
          @"
          Ultimate Macro v1.3.5 final test candidate
          Commit: $env:GITHUB_SHA
          TDS_Macro.zip SHA-256: $hash
          GitHub Release publication: NOT PERFORMED
          "@ | Set-Content -Encoding ascii ./dist/CANDIDATE_INFO.txt
          Get-Content ./dist/CANDIDATE_INFO.txt

      - name: Upload tester candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ultimate-Macro-v1.3.5-final-candidate
          path: |
            dist/TDS_Macro.zip
            dist/SHA256SUMS.txt
            dist/CANDIDATE_INFO.txt
          if-no-files-found: error
