name: Release package manifest

on:
  pull_request:
    paths:
      - "engine/**"
      - "app/**"
      - "ui/**"
      - "lib/**"
      - "submacros/**"
      - "Resources/**"
      - "Strategies/**"
      - "updater/**"
      - "Main.ahk"
      - "PACKAGE-MANIFEST.json"
      - ".github/scripts/verify_package_manifest.py"
      - ".github/scripts/test_verify_package_manifest.py"
      - ".github/workflows/engine-manifest.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "app/**"
      - "ui/**"
      - "lib/**"
      - "submacros/**"
      - "Resources/**"
      - "Strategies/**"
      - "updater/**"
      - "Main.ahk"
      - "PACKAGE-MANIFEST.json"
      - ".github/scripts/verify_package_manifest.py"
      - ".github/scripts/test_verify_package_manifest.py"
      - ".github/workflows/engine-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify tested package file hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that broken packages are caught
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check every included, launched and referenced file exists
        run: python3 .github/scripts/verify_package_manifest.py
