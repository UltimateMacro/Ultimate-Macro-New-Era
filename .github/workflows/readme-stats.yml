name: Update README stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get GitHub and Discord statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_readme_stats.py
      - name: Save new figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/community-stats.svg .github/assets/community-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "refresh readme stats"
            git push
          fi
