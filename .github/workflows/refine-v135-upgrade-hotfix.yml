name: Refine v1.3.5 upgrade hotfix

on:
  push:
    branches:
      - fix/v1.3.5-upgrade-affordance
    paths:
      - .github/workflows/refine-v135-upgrade-hotfix.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.3.5-upgrade-affordance
          fetch-depth: 0

      - name: Apply refinement
        shell: pwsh
        run: python _dev/refine_v135_upgrade_hotfix.py

      - name: Run focused contracts
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText((Resolve-Path 'Main.ahk'))
          $required = @(
            'UpgradeButtonGreenCoverage',
            'stableFrames >= 3',
            '0xF8F8F8',
            'MouseMove(ScaleX(unfocusX), ScaleY(unfocusY), 0)',
            'upgradeActionAttempts < 1'
          )
          foreach ($token in $required) {
            if (!$text.Contains($token)) { throw "Missing hotfix contract: $token" }
          }
          if (($text.Split('MouseMove(ScaleX(unfocusX), ScaleY(unfocusY), 0)').Count - 1) -lt 2) {
            throw 'Hover normalization must occur before and after click input.'
          }
          if ($text.Contains('enabledColors := [0x206435, 0x206235, 0x2B8046, 0x1D5930]')) {
            throw 'Old single-pixel affordability gate is still present.'
          }
          Write-Host 'Focused upgrade contracts: PASS'

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '_app/self_test.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | ForEach-Object Message | Out-String) }
          Write-Host 'PowerShell syntax: PASS'

      - name: Validate AutoHotkey and self-test
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.26.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.26'
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $ahk = Get-ChildItem -LiteralPath $dir -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($ahk)) { throw 'AutoHotkey64.exe not found' }

          $stdout = Join-Path $env:RUNNER_TEMP 'main-ahk.out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'main-ahk.err.txt'
          $mainPath = (Resolve-Path 'Main.ahk').Path
          $args = '/ErrorStdOut=UTF-8 /Validate "' + $mainPath.Replace('"', '\"') + '"'
          $proc = Start-Process -FilePath $ahk -ArgumentList $args -WorkingDirectory (Get-Location) -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) {
            Write-Host ((Get-Content $stderr -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stdout -Raw -ErrorAction SilentlyContinue))
            throw "Main.ahk validation failed with exit code $($proc.ExitCode)"
          }
          Write-Host 'Main.ahk AutoHotkey /Validate: PASS'
          & '_app/self_test.ps1' -Root (Resolve-Path '_app') -AhkPath $ahk -Quiet

      - name: Check diff hygiene
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit refinement
        shell: pwsh
        run: |
          git config user.name "Pizzaroles"
          git config user.email "alpizars2005@icloud.com"
          git add Main.ahk _app/self_test.ps1
          git commit -m "Harden v1.3.5 upgrade confirmation evidence" -m "Normalize mouse hover around click upgrades, sample a dense quantized evidence grid, and require a stable changed UI state before advancing tower level."
          git push origin HEAD:fix/v1.3.5-upgrade-affordance
