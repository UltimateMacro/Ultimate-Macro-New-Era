name: Bug report
description: Report a reproducible Ultimate Macro problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste Discord tokens, webhook URLs, private-server links, personal configuration, or other secrets. Use the private security-reporting route for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Ultimate Macro version
      placeholder: v1.3.5 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Startup / UI
        - Strategy recording
        - Strategy Lab / strategy parsing
        - Tower placement
        - Tower upgrades
        - Selling towers
        - TimeScale
        - Image detection / OCR
        - Matchmaking / map selection
        - Recovery / watchdog
        - Auto Equip / loadout
        - Discord webhook / Official Remote
        - Updater / packaging
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Official GitHub release ZIP
        - Git clone / development branch
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 100% scaling
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Roblox client size and window position
      placeholder: 1920x1009, primary monitor
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, private links, personal identifiers, and configuration before attaching evidence.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report.
          required: true
        - label: I can reproduce this on the version listed above.
          required: true
        - label: I removed secrets and private data from all evidence.
          required: true
