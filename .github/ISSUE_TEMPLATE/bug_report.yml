name: Bug report
description: Report a reproducible Ultimate Macro problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste Discord tokens, webhook URLs, private-server links, personal configuration, or other secrets. Use the private security-reporting route for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Ultimate Macro version
      placeholder: v1.3.3 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - GitHub release ZIP
        - Git clone / development branch
        - Other
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11 24H2, 100% scaling
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Roblox client size and window position
      placeholder: 1920x1009, moved to second monitor
  - type: dropdown
    id: backend
    attributes:
      label: Image-search backend
      options:
        - GDI+ fallback
        - OpenCV native
        - Unknown
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the stage of the run and the exact observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start strategy ...
        2. Wait for ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, private links, personal identifiers, and configuration first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed secrets and private data from all evidence.
          required: true
